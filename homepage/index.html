<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-Orion - Find People & Collaborate</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
</head>

<body>

<div class="app-container">

    <!-- NAVBAR -->
    <nav class="top-navbar">

        <div class="brand">
            <i class="fas fa-users brand-icon"></i>
            <span class="brand-name">Co-Orion</span>
        </div>

        <div class="nav-actions">
            <button class="nav-button"><i class="fas fa-pen"></i> Post</button>
            <button class="nav-button"><i class="fas fa-user-friends"></i> Network</button>
            <button class="nav-button"><i class="fas fa-bell"></i> Notifications</button>
            <button class="nav-button"><i class="fas fa-user"></i> Profile</button>
            <button class="nav-button chat-highlight"><i class="fas fa-comments"></i> Chat</button>
        </div>

    </nav>

    <!-- HERO -->
    <section class="hero-section">
        <h1>Welcome to Co-Orion</h1>
        <p>Find collaborators, explore projects, and build together</p>
    </section>

    <!-- SEARCH PANEL -->
    <section class="search-panel">

        <input type="text" class="search-input" placeholder="Search skills, tech stack, projects...">

        <div class="filter-group">
            <select>
                <option>Skills / Tech Stack</option>
                <option>AI/ML</option>
                <option>Web Development</option>
                <option>Design</option>
            </select>

            <select>
                <option>Project Type</option>
                <option>Hackathon</option>
                <option>Startup</option>
                <option>Research</option>
            </select>

            <select>
                <option>Collaboration Status</option>
                <option>Looking for Team</option>
                <option>Open to Collaborate</option>
            </select>
        </div>

    </section>

    <!-- USER FEED -->
    <section class="user-feed">

        <div class="user-card">

            <div class="user-avatar">
                <img src="https://img.freepik.com/free-photo/brunette-man-isolated-white-background_1368-4404.jpg?semt=ais_hybrid&w=740&q=80">
            </div>

            <div class="user-info">
                <h3>Joe Anderson</h3>
                <p>AI/ML Enthusiast • Java Developer • Hackathon Participant</p>

                <div class="skill-tags">
                    <span class="skill">AI</span>
                    <span class="skill">Java</span>
                    <span class="skill">Research</span>
                </div>

                <button class="primary-btn">Connect</button>
            </div>

        </div>

        <div class="user-card">

            <div class="user-avatar">
                <img src="https://media.istockphoto.com/id/177264786/photo/serious-middle-eastern-man.jpg">
            </div>

            <div class="user-info">
                <h3>Rahul Sharma</h3>
                <p>Full Stack Developer • Open Source Contributor</p>

                <div class="skill-tags">
                    <span class="skill">React</span>
                    <span class="skill">Node</span>
                    <span class="skill">Startup</span>
                </div>

                <button class="primary-btn">Connect</button>
            </div>

        </div>

    </section>

</div>

</body>
</html>
